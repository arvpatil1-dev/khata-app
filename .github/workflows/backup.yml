name: Daily Auto Backup
on:
  schedule:
    - cron: '30 16 * * *'  # रोज रात्री 10 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create backup
        run: |
          DATE=$(TZ='Asia/Kolkata' date +"%d-%b-%Y")
          echo "Creating backup for $DATE"
          
          # index.html backup - Root मधून
          if [ -f "index.html" ]; then
            cp index.html backup/index-$DATE.html
            echo "index.html backed up"
          fi
          
          # Code.gs backup - Root मधून (Capital C लक्षात घे)
          if [ -f "Code.gs" ]; then
            cp Code.gs backup/code-$DATE.gs
            cp Code.gs backup/code.gs
            echo "Code.gs backed up"
          elif [ -f "code.gs" ]; then
            cp code.gs backup/code-$DATE.gs
            cp code.gs backup/code.gs
            echo "code.gs backed up"
          else
            echo "WARNING: Code.gs not found in root!"
            ls -la
          fi
          
      - name: Commit backup
        run: |
          git config user.name "arvpatil1-dev"
          git config user.email "arvpatil1-dev@users.noreply.github.com"
          git add backup/
          git commit -m "Auto backup: $(TZ='Asia/Kolkata' date +'%d-%b-%Y')" || echo "No changes to commit"
          git push
