name: Daily Auto Backup
on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create backup
        run: |
          DATE=$(TZ='Asia/Kolkata' date +"%d-%b-%Y")
          echo "Creating backup for $DATE"
          if [ -f "index.html" ]; then
            cp index.html backup/index-$DATE.html
          fi
          if [ -f "Code.gs" ]; then
            cp Code.gs backup/code-$DATE.gs
            cp Code.gs backup/code.gs
          elif [ -f "code.gs" ]; then
            cp code.gs backup/code-$DATE.gs
            cp code.gs backup/code.gs
          fi
      - name: Commit backup
        run: |
          git config user.name "arvpatil1-dev"
          git config user.email "arvpatil1-dev@users.noreply.github.com"
          git add backup/
          git commit -m "Auto backup: $(TZ='Asia/Kolkata' date +'%d-%b-%Y')" || echo "No changes"
          git push
